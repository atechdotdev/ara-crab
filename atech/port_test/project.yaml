    static const int NMOVES = 19;
    static const uint8_t STAND[8] = {135, 45, 45, 135, 0, 180, 0, 180};
    static int moveIndex(const char* n) { for (int i = 0; i < NMOVES; i++) if (!strcmp(n, MOVE_NAMES[i])) return i; return -1; }

    // Power: during a move at most maxMoving servos are in motion at once, each at most
    // speedDps deg/s; the others wait their turn. USB alone gives too little current for eight
    // servos starting together. Set from the page: action "limit" "maxMoving,speedDps".
    static int maxMoving = 4, speedDps = 300;
    static int amountPct = 50;                      // how far moves swing around the stand pose, %
    static float tgt[N];                            // where each servo is headed during a move
    static int rr = 0;                              // round robin: who gets to move first
    static void slew(float dt) {
      int moving = 0;
      for (int k = 0; k < N; k++) {
        int i = (rr + k) % N;
        float now = S[i]->read(), d = tgt[i] - now;
        if (fabsf(d) < 0.5f) continue;
        if (moving >= maxMoving) break;
        float stepMax = speedDps * dt;
        put(i, now + constrain(d, -stepMax, stepMax));
        moving++;
      }
      rr = (rr + 1) % N;
    }
    static bool settled() {
      for (int i = 0; i < N; i++) if (fabsf(tgt[i] - S[i]->read()) >= 0.5f) return false;
      return true;
    }

    // Sesame's setServoAngle: its angle through the calibration to the servo on that joint
    static void setServoAngle(int ch, int deg) {
      int i = (ch >= 0 && ch < 8) ? slotOf[ch] : -1;
      if (i < 0) return;                            // no servo calibrated for this joint
      deg = STAND[ch] + (deg - STAND[ch]) * amountPct / 100;   // smaller moves, same stand
      int raw = (int)calNeu[i] + calDir[i] * (deg - 90);
      tgt[i] = constrain(raw, (int)calLo[i], (int)calHi[i]);
    }
    static const int16_t* kf = nullptr;             // the keyframe playing (nullptr: no move)
    static unsigned long nextKey = 0;
    static int curMove = -1, reps = 0;
    static const int TURN_REPS = 3;                 // no motion sensor: a turn is 3 units
    static void startMove(int m) {
      curMove = m; kf = MOVE_DATA[m]; nextKey = millis(); reps = 0;
      for (int i = 0; i < N; i++) tgt[i] = S[i]->read();
      mode = MOVING; active = N; limp = false;
      char s[40]; snprintf(s, sizeof s, "move: %s", MOVE_NAMES[m]); setStep(s);
    }

    // the screen: the step on top, then one 9 px row per servo: port, angle bar, degrees
    static void drawScreen() {
      tft.clear();
      tft.displayText(step, 2, 0, 1, ST7735_TFT::COLOR_CYAN);
      for (int i = 0; i < N; i++) {
        int y = 8 + i * 9;
        bool hot = !limp && (active == i || active == N);
        uint16_t col = limp ? 0x8410 : hot ? ST7735_TFT::COLOR_YELLOW : ST7735_TFT::COLOR_WHITE;
        char lab[6], num[8];
        snprintf(lab, sizeof lab, "P%d", PORTS[i]);
        tft.displayText(lab, 2, y, 1, col);
        tft.drawRect(24, y, 102, 8, 0x4208);
        int deg = (int)(S[i]->read() + 0.5f);
        if (!limp) tft.fillRect(25, y + 1, deg * 100 / 180, 6, hot ? ST7735_TFT::COLOR_YELLOW : 0x2D7F);
        tft.drawLine(75, y, 75, y + 7, 0x8410);           // 90 deg mark
        if (limp) strcpy(num, "limp"); else snprintf(num, sizeof num, "%d", deg);
        tft.displayText(num, 130, y, 1, col);
      }
      tft.display();
    }

    // the tour: N servos x 4 poses alone, then all together, a wave and a sweep
    static const int TOUR_STEPS = N * 4 + 3;
    static unsigned long tourT0 = 0;
    static int tourAt = -1;
    static void tourPose(int k, float t) {          // t: seconds into step k
      static const float POSE[4] = {90, 30, 150, 90};
      char s[40];
      if (k < N * 4) {
        int i = k / 4, p = k % 4;
        active = i;
        snprintf(s, sizeof s, "port %d: to %d deg", PORTS[i], (int)POSE[p]);
        setStep(s);
        for (int j = 0; j < N; j++) put(j, j == i ? POSE[p] : 90);
      } else if (k == N * 4) {
        active = N; setStep("all together 45..135");
        putAll(90 - 45 * sinf(t * 2.0f));
      } else if (k == N * 4 + 1) {
        active = N; setStep("travelling wave");
        for (int j = 0; j < N; j++) put(j, 90 + 45 * sinf(t * 3.0f - j * 0.9f) * fminf(1.0f, t));
      } else {
        active = N; setStep("slow sweep 30..150");
        putAll(90 - 60 * sinf(t * 1.0f));
      }
    }
    static float tourLen(int k) {
      if (k < N * 4) return 0.9f;
      return k == N * 4 ? 6.28f : k == N * 4 + 1 ? 8.0f : 6.28f;   // whole cycles: ends at 90
    }
  setup: |
    calLoad();
    putAll(90);
    setStep("ready: all at 90");
    drawScreen();
  loop: |
    static unsigned long t0 = millis(), next = 0;
    static EveryTimer screen;
    static int swing = 0;
    if (atech_action == "cal") {
      int port, j, neu, dir, lo, hi;
      if (sscanf(atech_value.c_str(), "%d,%d,%d,%d,%d,%d", &port, &j, &neu, &dir, &lo, &hi) == 6)
        for (int i = 0; i < N; i++) if (PORTS[i] == port) {
          calJoint[i] = (j >= 0 && j < 8) ? j : -1; calNeu[i] = constrain(neu, 0, 180);
          calDir[i] = dir < 0 ? -1 : 1; calLo[i] = constrain(lo, 0, 180); calHi[i] = constrain(hi, 0, 180);
        }
      calIndex();
      atechDone();
    }
    if (atech_action == "calsave") { calSave(); atechDone(); }
    if (atech_action == "limit") {
      int k, sp, am = amountPct;
      if (sscanf(atech_value.c_str(), "%d,%d,%d", &k, &sp, &am) >= 2) {
        maxMoving = constrain(k, 1, N); speedDps = constrain(sp, 30, 1000); amountPct = constrain(am, 10, 100);
      }
      atechDone();
    }
    if (atech_action == "go") {
      String v = atech_value; v.trim();
      int m = moveIndex(v == "stop" ? "stand" : v.c_str());
      if (m >= 0) startMove(m);
      atechDone();
    }
    if (atech_action == "test") {
      kf = nullptr;                                 // any test command stops a move
      String v = atech_value; v.trim();
      bool center = true;
      limp = false;
      if (v == "tour") { mode = TOUR; tourAt = -1; }
      else if (v == "all") { mode = ALL; active = N; setStep("all swing 60..120"); }
      else if (v == "stop") { mode = HOLD; active = -1; setStep("stop: all at 90"); }
      else if (v == "hold") { mode = HOLD; active = -1; center = false; setStep("hold"); }
      else if (v == "limp") { mode = LIMP; active = -1; limp = true; setStep("limp: no pulses"); }
      else {
        int p = v.toInt();
        for (int i = 0; i < N; i++) if (PORTS[i] == p) {
          mode = ONE; which = active = i;
          char s[40]; snprintf(s, sizeof s, "port %d swings 60..120", p); setStep(s);
        }
      }
      if (mode == LIMP) for (int i = 0; i < N; i++) S[i]->detach();
      else if (center) putAll(90);
      atechDone();
    }
    if (millis() - t0 < 2000) { if (screen.ready(100)) drawScreen(); return; }   // 2 s at 90 first

    if (mode == TOUR) {
      float t = (millis() - tourT0) / 1000.0f;
      if (tourAt < 0 || t > tourLen(tourAt)) { tourAt = (tourAt + 1) % TOUR_STEPS; tourT0 = millis(); t = 0; }
      tourPose(tourAt, t);
    } else if (mode == ONE && millis() > next) {
      next = millis() + 600; swing = !swing;
      put(which, swing ? 120 : 60);
    } else if (mode == ALL) {
      putAll(90 + 30 * sinf(millis() / 1000.0f * 2.5f));
    } else if (mode == MOVING) {
      static unsigned long lastSlew = millis();
      float dt = (millis() - lastSlew) / 1000.0f; lastSlew = millis();
      slew(constrain(dt, 0.0f, 0.05f));
      // a keyframe's hold starts when the servos have caught up: slower servos, slower moves
      if (!settled() && (long)(millis() - nextKey) >= 0) nextKey = millis();
      while (kf != nullptr && settled() && (long)(millis() - nextKey) >= 0) {
        if (kf[0] < 0) {                            // end of the move
          bool turn = curMove == moveIndex("left") || curMove == moveIndex("right");
          if (turn && ++reps < TURN_REPS) { kf = MOVE_DATA[curMove]; continue; }
          kf = nullptr; active = -1;
          char s[40]; snprintf(s, sizeof s, "done: %s", MOVE_NAMES[curMove]); setStep(s);
          break;
        }
        int hold = kf[0], n = kf[1];
        for (int k = 0; k < n; k++) setServoAngle(kf[2 + 2 * k], kf[3 + 2 * k]);
        kf += 2 + 2 * n;
        nextKey += hold;
      }
    }
    if (screen.ready(100)) drawScreen();      // 10 frames a second: the bars follow the servos
    static EveryTimer report;
    if (report.ready(200)) {                  // the angles, 5 times a second, for the control page
      Serial.print("{\"type\":\"event\",\"payload\":{\"event_type\":\"sensor\",\"key\":\"angles\",\"value\":[");
      for (int i = 0; i < N; i++) { if (i) Serial.print(","); Serial.print(limp ? -1 : (int)(S[i]->read() + 0.5f)); }
      Serial.println("]}}");
    }

    static char step[40] = "starting";
    static bool limp = false;

    static void event(const char* v) {
      Serial.printf("{\"type\":\"event\",\"payload\":{\"event_type\":\"state\",\"key\":\"test\",\"value\":\"%s\"}}\n", v);
    }
    static void setStep(const char* s) {
      if (strcmp(s, step)) { strncpy(step, s, sizeof step - 1); event(step); }
    }
    static void put(int i, float deg) { S[i]->write(deg); }
    static void putAll(float deg) { for (int i = 0; i < N; i++) put(i, deg); }

    // ---- calibration: which Sesame joint each servo is, its 90 deg, direction, limits ----
    static int8_t calJoint[N], calDir[N];
    static uint8_t calNeu[N], calLo[N], calHi[N];
    static int8_t slotOf[8];                        // Sesame channel -> servo slot (-1: none)
    static void calIndex() {
      for (int c = 0; c < 8; c++) slotOf[c] = -1;
      for (int i = 0; i < N; i++) if (calJoint[i] >= 0 && calJoint[i] < 8) slotOf[calJoint[i]] = i;
    }
    static void calLoad() {
      for (int i = 0; i < N; i++) { calJoint[i] = -1; calDir[i] = 1; calNeu[i] = 90; calLo[i] = 0; calHi[i] = 180; }
      uint8_t b[5 * N];
      Preferences pr; pr.begin("cal", true);
      if (pr.getBytes("v1", b, sizeof b) == sizeof b)
        for (int i = 0; i < N; i++) {
          calJoint[i] = (int)b[5 * i] - 1; calNeu[i] = b[5 * i + 1]; calDir[i] = b[5 * i + 2] ? -1 : 1;
          calLo[i] = b[5 * i + 3]; calHi[i] = b[5 * i + 4];
        }
      pr.end();
      calIndex();
    }
    static void calSave() {
      uint8_t b[5 * N];
      for (int i = 0; i < N; i++) {
        b[5 * i] = calJoint[i] + 1; b[5 * i + 1] = calNeu[i]; b[5 * i + 2] = calDir[i] < 0;
        b[5 * i + 3] = calLo[i]; b[5 * i + 4] = calHi[i];
      }
      Preferences pr; pr.begin("cal", false); pr.putBytes("v1", b, sizeof b); pr.end();
    }


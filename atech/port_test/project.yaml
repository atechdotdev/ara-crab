# Written by make_project.py from project.in.yaml: edit that file.
name: port_test
board: 14port
# Servo test: one MG90S on Line A (data 1, pin 5) of each of ports 1, 2, 3, 4, 5, 6, 13, 14,
# red to +5V, brown to GND. Screen on ports 9+10 shows what the test is doing: the step on
# top, then each servo's angle as a bar (yellow = moving).
#   At boot all hold 90 deg. The tour (atech send test tour, or Tour on the page) loops:
#     each servo alone: 90 -> 30 -> 150 -> 90, then all together (smooth, 45..135),
#     a travelling wave, and a slow sweep 30..150.
#   atech send test tour  -> the tour
#   atech send test 13    -> only port 13 swings 60 <-> 120
#   atech send test all   -> all swing together (smooth)
#   atech send test stop  -> all to 90 and hold
#   atech send test hold  -> stop moving, keep each angle (then s2_set 45 etc. per servo)
#   atech send test limp  -> stop pulsing: all go limp
# Walking: Sesame's moves (rest stand wave dance swim point pushup bow cute freaky worm shake
# shrug dead crab walk back left right), read from firmware/movement-sequences.h.
#   atech send go walk    -> play one move; atech send go stop -> stand
#   atech send limit 4,300,50 -> at most 4 servos moving at once, 300 deg/s each, moves at 50 %
#     of Sesame's swing around the stand pose (USB power)
# Each Sesame angle is sent to a servo through its calibration: raw = 90-mark + dir * (deg - 90),
# kept within its limits. The control page sends the calibration (action "cal":
# "port,joint,neutral,dir,lo,hi", joint = Sesame channel R1 R2 L1 L2 R4 R3 L3 L4 = 0..7, -1 none)
# and "calsave" stores it in the board's flash: the board keeps it across restarts.
# No motion sensor: walk does not hold a heading, and a turn is 3 of Sesame's turn units.
#   Control page: python3 control.py, then http://localhost:8766
# The moves where all servos go together are smooth ramps, not jumps: eight servos starting at
# the same instant pull more current than the board's USB 5 V gives, and the board resets.
# Feed the servos from a 5 V 3 A supply (grounds joined) for the real thing.
modules_path: ./my_modules
modules:
  - {id: mg90s_one,  instance: s1,  port: 1}
  - {id: mg90s_one,  instance: s2,  port: 2}
  - {id: mg90s_one,  instance: s3,  port: 3}
  - {id: mg90s_one,  instance: s4,  port: 4}
  - {id: mg90s_one,  instance: s5,  port: 5}
  - {id: mg90s_one,  instance: s6,  port: 6}
  - {id: mg90s_one,  instance: s13, port: 13}
  - {id: mg90s_one,  instance: s14, port: 14}
  - {id: st7735_tft, instance: tft, ports: [9, 10]}

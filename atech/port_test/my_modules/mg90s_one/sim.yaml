# Simulation data for `mg90s_pair`: not an Atech module, one servo plug on jumper wires
# pushed into a port's header. The geometry is the two 3-pin jumper plugs (2.54 mm
# Dupont housings), not the servos; the servos are part of the robot's own model.
# Asset frame: metres, origin at the centre of the bottom face, +z up, +x along the port.
schema: 1

# Right-angle (90 deg) female Dupont plugs, lying flat and entering the port from the board's
# long edge (Atech ports are side-entry; Atech Atelier's Sesame walker assumes this). Port frame:
# +y toward the board's edge, the module seat 0.5 mm above the PCB top. One 3-pin housing (sized for two) side by
# side, 7.6 mm each along the edge, reaching from 2.5 mm inside the edge to 5.5 mm past it.
size_m: [0.0152, 0.008, 0.0025]   # two 3-pin right-angle Dupont housings, typical size
mass_kg: 0.002                  # PLACEHOLDER: typical jumper plugs and wire

colors:
  body: [0.08, 0.08, 0.09, 1]
  accent: [0.85, 0.25, 0.15, 1]

parts:
  - {name: plug_a, size_m: [0.0076, 0.008, 0.0025], pos_m: [-0.0038, 0.0115, 0.0008], color: body}
  - {name: plug_b, size_m: [0.0076, 0.008, 0.0025], pos_m: [0.0038, 0.0115, 0.0008], color: accent}

connector:
  pos_m: [0, 0, 0]
  rpy_deg: [0, 0, 0]

physics_material:               # PLACEHOLDER: plastic
  static_friction: 0.5
  dynamic_friction: 0.4
  restitution: 0.1

semantic:
  class: [connector, cable]

placeholders: [mass_kg, physics_material]

    static const int16_t MOVE_BACK[] = {100, 0, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 100, 2, 5, 135, 6, 0, 100, 4, 7, 135, 3, 135, 4, 0, 0, 90, 100, 2, 1, 90, 2, 0, 100, 2, 4, 45, 7, 180, 100, 4, 5, 180, 6, 45, 1, 45, 2, 90, 100, 2, 3, 90, 0, 180, 300, 8, 0, 135, 1, 45, 2, 45, 3, 135, 4, 0, 5, 180, 6, 0, 7, 180, -1};

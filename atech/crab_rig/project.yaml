name: crab_rig
board: 14port
# Servo rig for Atech-crab (Sesame's 8 joints). Driven by the mapping page (rig_server.py):
#   pulse  "10 1500 FR hip"  -> port 10's Line A (pin 5) to a 1500 us pulse, screen shows "FR hip"
#   pulse  "g47 1500 FR hip" -> a raw GPIO instead of a port (for a port the pin map has wrong)
#   wiggle "10 1500 FR hip"  -> +-150 us around 1500 for 2 s, then hold 1500
#   limp   "10" / "all"      -> stop pulsing: the servo goes limp
#   label  "any text"        -> show text on the screen
#   stand                    -> every joint to its neutral angle, one after another
#   check                    -> all limp, then each port's pin 5: servo seen / nothing / held high
#   move   "walk" / "stop"   -> play one of Sesame's moves on the mapped joints (walk, back, left, right,
#                               stand, rest, wave, dance, ...); "stop" ends it where it is
#   speed  "100"             -> move speed in % of Sesame's timing (frameDelay); default 60
#   amp    "60"              -> step size: every move scaled around the stand pose, in % of Sesame's
#   mdelay "20"              -> ms between servo writes in a frame (Sesame's motorCurrentDelay)
# The joint map and neutral angles sit between CONFIG BEGIN / END below; the mapping page's
# Save button rewrites them and flashes the board.
# MG90S servos: 0..180 deg = 500..2400 us, and no pulse outside that. 8 servos at most (8 LEDC channels).
# A "hello" event every 2 s; a 3 s watchdog restarts the board if the loop stalls.
modules_path: ../servo_test/my_modules
modules:
  - {id: st7735_tft,  instance: tft, ports: [9, 10]}
  - {id: servo_probe, instance: p1,  port: 1}
  - {id: servo_probe, instance: p2,  port: 2}
  - {id: servo_probe, instance: p3,  port: 3}
  - {id: servo_probe, instance: p4,  port: 4}
  - {id: servo_probe, instance: p5,  port: 5}
  - {id: servo_probe, instance: p6,  port: 6}
  - {id: servo_probe, instance: p7,  port: 7}
  - {id: servo_probe, instance: p11, port: 11}
  - {id: servo_probe, instance: p13, port: 13}
  - {id: servo_probe, instance: p14, port: 14}
